# CI for ai-vnv/gym-duckietown: tests under xvfb + optional Sphinx build artifact.
name: CI

on:
  push:
    branches: [daffy, main]
  pull_request:
    branches: [daffy, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: setup.py

      - name: Install system packages (OpenGL / headless)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libegl-mesa0 libglx-mesa0 libgl1-mesa-dri libglu1-mesa freeglut3-dev

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest (xvfb)
        run: xvfb-run -a python -m pytest tests/ -v --tb=short

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package + Sphinx (autodoc imports ``gym_duckietown``)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build Sphinx HTML
        run: sphinx-build -b html docs docs/_build/html

      - uses: actions/upload-artifact@v4
        with:
          name: sphinx-html
          path: docs/_build/html
